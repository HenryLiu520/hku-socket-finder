server:
  port: ${SF_PORT:8081}
  address: ${SF_BIND:127.0.0.1}

spring:
  application:
    name: socket-finder
  datasource:
    url: ${SF_DB_URL:jdbc:postgresql://localhost:5433/socketfinder}
    username: ${SF_DB_USER:ran}
    password: ${SF_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Hong_Kong
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors-allowed-origin: ${SF_CORS_ORIGIN:http://localhost:5175}
  stale-days: 30
  reports-needed: 2
  report-window-hours: 24

logging:
  level:
    org.hibernate.SQL: warn
